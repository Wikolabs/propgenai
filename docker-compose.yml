version: "3.9"

# propgenai demo - production-ready POC.
# 2 services orchestrated:
#   - propgenai (Next.js frontend on host port 3006)
#   - propgenai-backend (FastAPI Python, internal only on 8000)
# Shared external network wkdemo-net (created once by deploy.yml) avoids
# Docker default address-pool exhaustion across all 47 LP stacks.

services:
  propgenai-backend:
    image: ghcr.io/wikolabs/propgenai-backend:latest
    container_name: propgenai-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - wkdemo_net

  propgenai:
    image: ghcr.io/wikolabs/propgenai:latest
    container_name: propgenai
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      BACKEND_URL: "http://propgenai-backend:8000"
    depends_on:
      - propgenai-backend
    networks:
      - wkdemo_net

networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
